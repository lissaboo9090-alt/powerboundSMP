plugins {
    id 'java'
}

group = 'beta.teneitri'
version = '1.0'

repositories {
    mavenCentral()
    // Using the stable production library mirror hub (No automated script block walls)
    maven { url = 'https://spigotmc.org' }
}

dependencies {
    // Locked onto a stable release build framework version entry
    compileOnly 'org.spigotmc:spigot-api:1.21-R0.1-SNAPSHOT'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName = 'powerboundSMP-1.0.jar'
}
